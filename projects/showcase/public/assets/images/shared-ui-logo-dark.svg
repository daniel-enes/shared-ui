  <g fill="url(#purple-dark)">
    <path d="M35 4 L62 18 L35 32 L8 18 Z"/>
    <path d="M8 29 L15 25.4 L35 35.8 L55 25.4 L62 29 L35 43 Z" opacity=".94"/>
    <path d="M8 40 L15 36.4 L35 46.8 L55 36.4 L62 40 L35 54 Z" opacity=".86"/>
