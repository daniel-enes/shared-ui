<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="70" viewBox="0 0 300 70" role="img" aria-labelledby="title desc">
  <title id="title">Shared UI — Component Library</title>
  <desc id="desc">A layered lavender and purple geometric mark beside the Shared UI wordmark and Component Library subtitle, designed for dark backgrounds.</desc>

