<div class="container py-5">
  <h2 class="mb-4">Demonstração dos componentes de botão</h2>

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">UiButton</h5>

      <div class="d-flex flex-wrap gap-2 align-items-center">
        <ui-button
          text="Salvar"
          icon="bi bi-save"
          variant="primary"
          type="submit"
        />

        <ui-button
          text="Enviar"
          icon="bi bi-send"
          variant="success"
          [loading]="loading()"
          loadingMessage="Enviando..."
          (clicked)="simulateAsyncAction()"
        />

        <ui-button
          icon="bi bi-trash"
          ariaLabel="Remover usuário"
          variant="danger"
          (clicked)="registerClick()"
        />

        <ui-button
          text="Editar"
          icon="bi bi-pencil"
          variant="outline-primary"
          size="sm"
        />

        <ui-button
          text="Confirmar"
          variant="primary"
          size="lg"
          [fullWidth]="true"
        />

        <ui-button
          text="Cancelar"
          variant="outline-secondary"
          [disabled]="true"
        />
      </div>

      <p class="mt-3 mb-0 text-body-secondary">
        Cliques registrados: {{ clicks() }}
      </p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h5 class="card-title">UiButtonLink</h5>

      <div class="d-flex flex-wrap gap-2 align-items-center">
        <ui-button-link
          text="Visualizar usuário"
          icon="bi bi-eye"
          [routerLink]="['/users', 1]"
          variant="primary"
        />

        <ui-button-link
          icon="bi bi-pencil"
          ariaLabel="Editar usuário"
          [routerLink]="['/users', 1, 'edit']"
          variant="outline-primary"
        />

        <ui-button-link
          text="Voltar ao início"
          icon="bi bi-house"
          [routerLink]="['/']"
          variant="secondary"
        />
      </div>
    </div>
  </div>
</div>
