<div class="container py-5">
  <h2 class="mb-4">Demonstração do FormInput</h2>

  <div class="card">
    <div class="card-body">

      <form
        uiFormContext
        #formContext="uiFormContext"
        (submit)="onSubmit($event, formContext)"
        novalidate
      >

        <ui-form-alert
          [form]="registerForm"
        />

        <ui-form-input
          [field]="registerForm.username"
          label="Nome de usuário"
          placeholder="Informe seu username"
          description="Utilize pelo menos 8 caracteres."
          fieldName="username"
        />

        <ui-form-input
          [field]="registerForm.email"
          label="Email"
          type="email"
          placeholder="Informe seu email"
          [descriptionItems]="[
            'Apenas endereços corporativos',
            'Não utilizaremos seu endereço para spam'
          ]"
          fieldName="email"
        />

        <ui-form-input
          [field]="registerForm.password"
          label="Senha"
          type="password"
          placeholder="Digite sua senha"
          description="Crie uma senha segura."
          [descriptionItems]="[
            'Mínimo de 8 caracteres',
            'Uma letra maiúscula',
            'Um número'
          ]"
          fieldName="password"
        />

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="registerForm().submitting()"
        >
          @if (registerForm().submitting()) {
            Enviando...
          } @else {
            Enviar
          }
        </button>

      </form>

      <hr>

      <h5>Modelo atual:</h5>
      <pre>{{ model() | json }}</pre>

    </div>
  </div>
</div>
