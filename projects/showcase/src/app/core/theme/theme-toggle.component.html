<button
  type="button"
  class="btn btn-sm theme-toggle"
  (click)="toggleTheme()"
  [attr.aria-label]="themeService.getAriaLabel()"
>
  <span class="theme-toggle__icon" aria-hidden="true">
    @if (theme() === 'system') {
      auto
    } @else if (theme() === 'light') {
      ☀
    } @else {
      ☾
    }
  </span>
</button>
