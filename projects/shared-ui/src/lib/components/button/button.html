<button
  [class]="buttonClasses()"
  [type]="type()"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.title]="resolvedTitle() || null"
  (click)="handleClick()"
>
  @if (loading()) {
    <span
      class="spinner-border spinner-border-sm me-2"
      aria-hidden="true"
    ></span>

    <span
      role="status"
      aria-live="polite"
    >
      {{ loadingMessage() }}
    </span>
  } @else {
    @if (icon()) {
      <i
        [class]="icon()"
        aria-hidden="true"
      ></i>
    }

    @if (text()) {
      <span class="mx-2">{{ text() }}</span>
    }
  }
</button>
