@if (visible()) {
  <div
    #alertElement
    [class]="alertClasses()"
    role="status"
    aria-live="polite"
    tabindex="-1"
    [attr.aria-labelledby]="title() ? titleId() : null"
  >

    <span
      class="alert-icon"
      [class]="variantIcon()"
      aria-hidden="true">
    </span>

    @if (title()) {
      <h5
        [id]="titleId()"
        class="alert-heading">

        {{ title() }}

      </h5>
    }

    <p class="mb-0">

      {{ message() }}

    </p>

    @if (dismissible()) {
      <button
        type="button"
        class="btn-close"
        [attr.aria-label]="dismissLabel()"
        (click)="onDismiss()">
      </button>
    }

  </div>
}
