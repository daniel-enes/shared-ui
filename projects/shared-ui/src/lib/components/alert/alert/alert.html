@if (visible()) {
  <div
    #alertElement
    [class]="alertClasses()"
    role="status"
    aria-live="polite"
    tabindex="-1"
    [attr.aria-labelledby]="title() ? titleId() : null"
  >

    <div class="ui-alert__heading">
      <span
        class="alert-icon bi"
        [class.bi-check-circle-fill]="variant() === 'success'"
        [class.bi-info-circle-fill]="variant() === 'info'"
        [class.bi-exclamation-triangle-fill]="variant() === 'warning'"
        [class.bi-x-circle-fill]="variant() === 'danger'"
        aria-hidden="true">
      </span>

      @if (title()) {
        <h5
          class="alert-heading mb-0"
          [id]="titleId()">
          {{ title() }}
        </h5>
      }
    </div>

    <p class="mb-0">

      {{ message() }}

    </p>

    @if (dismissible()) {
      <button
        type="button"
        class="btn-close"
        [attr.aria-label]="dismissLabel()"
        (click)="onDismiss()">
      </button>
    }

  </div>
}
