<div
  class="mb-3"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)"
>

  <label
    [for]="resolvedInputId()"
    class="form-label"
    [class.visually-hidden]="labelHidden()">

    {{ label() }}

  </label>

  @if (description()) {
    <div
      [id]="descriptionId()"
      class="form-text mb-2">

      {{ description() }}

    </div>
  }

  <select
    [formField]="field()"
    [id]="resolvedInputId()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showError() ? 'true' : null"
    [class.is-invalid]="showError()"
    class="form-select"
  >

    <option value="" disabled>
      {{ placeholder() }}
    </option>

    @for (option of options(); track option.value) {
      <option
        [value]="option.value"
        [disabled]="option.disabled ?? false">

        {{ option.label }}

      </option>
    }

  </select>

  @if (isPending()) {
    <div
      [id]="pendingId()"
      class="form-text"
      role="status">

      <span
        class="spinner-border spinner-border-sm me-2"
        aria-hidden="true">
      </span>

      {{ pendingMessage() }}

    </div>
  }

  @if (hasErrorMessage()) {
    <div
      [id]="feedbackId()"
      class="invalid-feedback d-block"
      aria-live="polite">

      {{ errorMessage() }}

    </div>
  }

  @if (canReturnToAlert()) {
    <button
      type="button"
      class="form-select__summary-link"
      (click)="returnToAlert()">

      Voltar ao resumo de erros

    </button>
  }

</div>
