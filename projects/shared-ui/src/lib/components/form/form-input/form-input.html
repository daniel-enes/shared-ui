<div
  class="mb-3"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)"
>

  <label
    [for]="resolvedInputId()"
    class="form-label"
    [class.visually-hidden]="labelHidden()">

    {{ label() }}

  </label>

  @if (description()) {
    <div
      [id]="descriptionId()"
      class="form-text mb-2">

      {{ description() }}

    </div>
  }

  <input
    [formField]="field()"
    [id]="resolvedInputId()"
    [type]="type()"
    [placeholder]="placeholder()"
    [attr.aria-describedby]="describedByWithCharacterCount()"
    [attr.aria-invalid]="showError() ? 'true' : null"
    [class.is-invalid]="showError()"
    class="form-control"
  />
  @if (showCharacterCount()) {
    <div
      [id]="characterCountId()"
      class="form-text text-end">

      {{ currentLength() }} de {{ maxLength() }} caracteres

    </div>
  }

  @if (isPending()) {
    <div
      [id]="pendingId()"
      class="form-text"
      role="status">

      <span
        class="spinner-border spinner-border-sm me-2"
        aria-hidden="true">
      </span>

      {{ pendingMessage() }}

    </div>
  }

  @if (hasErrorMessage()) {
    <div
      [id]="feedbackId()"
      class="invalid-feedback d-block"
      aria-live="polite">

      {{ errorMessage() }}

    </div>
  }

  @if (canReturnToAlert()) {
    <button
      type="button"
      class="form-input__summary-link"
      (click)="returnToAlert()"
    >
      Voltar ao resumo de erros
    </button>
  }



</div>
