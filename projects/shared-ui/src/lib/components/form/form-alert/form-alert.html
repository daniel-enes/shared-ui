@if (visible()) {
  <div
    class="alert alert-danger form-alert"
    role="alert"
    aria-labelledby="form-alert-title"
  >
    <h2 id="form-alert-title" class="alert-heading fs-6">
      Não foi possível enviar o formulário.
    </h2>

    <p class="mb-2">
      Verifique os seguintes problemas:
    </p>

    <ul class="mb-0">
      @for (error of alertErrors(); track error.id) {
        <li class="my-3">
          @if (error.fieldTree) {
            <button
              type="button"
              class="alert-link form-alert__error-link"
              (click)="focusError(error)"
            >
              {{ error.message }}
            </button>
          } @else {
            <span>{{ error.message }}</span>
          }
        </li>
      }
    </ul>
  </div>
}
