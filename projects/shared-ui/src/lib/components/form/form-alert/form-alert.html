@if (visible()) {
  <section
    #alertElement
    class="alert alert-danger form-alert"
    role="region"
    [attr.aria-labelledby]="titleId()"
    tabindex="-1"
  >
    <h2 [id]="titleId()" class="alert-heading fs-6">
      Não foi possível enviar o formulário.
    </h2>

    <p class="mb-2">
      Verifique os seguintes problemas:
    </p>

    <ul class="mb-0">
      @for (error of alertErrors(); track error.id) {
        <li class="my-3">
          <button
            type="button"
            class="alert-link form-alert__error-link"
            (click)="focusError(error)"
          >
            {{ error.message }}
          </button>
        </li>
      }
    </ul>
  </section>
}
